name: Build EAHentai filtered APK

on:
  workflow_dispatch:
  push:
    branches: [feature/eahentai-source]
    paths:
      - 'src/en/eahentai/**'
      - '.github/workflows/build-eahentai-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run lint
        run: ./gradlew :src:en:eahentai:assembleDebug :src:en:eahentai:lintRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: eahentai-komikku-filtered-apk
          path: src/en/eahentai/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
